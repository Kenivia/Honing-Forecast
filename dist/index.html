    <!-- before the stylesheets load, so neither the move's hops nor the first paint flash white -->
    <style>
        html { background: var(--bg-very-muted, #0d0d11); color-scheme: dark; }
    </style>
    <script>
        // Domain move, old site's side: sends this browser's localStorage to migrate/index.html in hash chunks, then
        // redirects. Off unless VITE_MIGRATE_FROM is this origin; ?stay opts out. See AI notes "Frontend/Domain move".
        (async () => {
            const FROM = "https://honing-forecast.pages.dev";
            const TO = "https://honing-forecast.com";
            if (!FROM || location.origin !== FROM) return;
            if (new URLSearchParams(location.search).has("stay")) return;
            window.hf_leaving = true; // main.ts skips mounting
            const MOVED = "hf_moved";
            const TRIES = "hf_move_tries";
            const CHUNK = 500000;
            const h = new URLSearchParams(location.hash.slice(1));
            const step = h.get("hfm");
            const safe = (p) => (p && p[0] === "/" && p[1] !== "/" && p[1] !== "\\" ? p : "/");
            const to = safe(step ? h.get("to") : location.pathname + location.search + location.hash);
            // via migrate/ so it sets the "moved" banner; once moved, straight to the app
            const go = (why, err = "") => location.replace(TO + "/migrate/#" + new URLSearchParams({ hfm: "arrive", to, why, err }));
            const straight = () => location.replace(TO + to);
            try {
                if (step === "done") localStorage.setItem(MOVED, "1");
                if (localStorage.getItem(MOVED)) return straight();
                const part = step === "part" ? Number(h.get("part")) : 0;
                if (part === 0) {
                    // a browser that never gets through stops trying after 3 visits
                    const tries = Number(localStorage.getItem(TRIES) ?? 0);
                    if (tries >= 3) return go("gave_up");
                    localStorage.setItem(TRIES, String(tries + 1));
                }
                const entries = {};
                for (let i = 0; i < localStorage.length; i++) {
                    const k = localStorage.key(i);
                    if (k !== MOVED && k !== TRIES) entries[k] = localStorage.getItem(k);
                }
                // nothing to send: same as typing the new address (no banner, no report)
                if (!Object.keys(entries).length) {
                    localStorage.setItem(MOVED, "1");
                    return straight();
                }
                const stream = new Blob([JSON.stringify(entries)]).stream().pipeThrough(new CompressionStream("deflate-raw"));
                const bytes = new Uint8Array(await new Response(stream).arrayBuffer());
                let bin = "";
                for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
                const data = btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
                const of = Math.ceil(data.length / CHUNK);
                if (!(part >= 0 && part < of)) return go("bad_part");
                const q = new URLSearchParams({ n: part, of, len: data.length, to });
                location.replace(TO + "/migrate/#" + q + "&d=" + data.slice(part * CHUNK, (part + 1) * CHUNK));
            } catch (e) {
                go("error", String(e).slice(0, 200));
            }
        })();
    </script>
