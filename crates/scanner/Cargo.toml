[package]
name = "hf-scanner"
edition = "2024"
description = "Honing calculator for Lost Ark"
repository = "https://github.com/Kenivia/Honing-Forecast"
license = "AGPL-3.0-or-later"
version = "0.1.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
js-sys = "0.3"
serde_json = "1.0"
ahash = "0.8"
fast_image_resize = "6.1.0"
image = {version = "0.25.10", default-features = false, features = ["png"] }
imageproc = {version = "0.27.0", default-features = false }
realfft = {version="3.5.0", features=["wasm_simd"]}
rustfft = {version="6.4.1", features=["wasm_simd"]}
parking_lot = {version="0.12.5"}
ocrs = "0.13.0"
rten = "0.26.0"
rten-imageproc = "0.26.0"
rmp-serde = "1.3.1"
strsim = "0.11.1"
serde_bytes = "0.11.19"
