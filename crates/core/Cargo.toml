[package]
name = "hf-core"
edition = "2024"
description = "Honing calculator for Lost Ark"
repository = "https://github.com/Kenivia/Honing-Forecast"
license = "AGPL-3.0-or-later"
version = "0.1.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rand = "0.9"
statrs = {version = "0.18.0", default-features = false}
num = "0.4.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ordered-float = "5.3.0"
cfg-if = "1.0"
priority-queue = "2.7.0"
ahash = {version = "0.8", features=["serde"]}
either = "1.17.0"
once_cell = "1.21.4"
smallvec = {version="1.15.2", features=["serde"]}
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
web-time = "1.1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["console"] }
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
itertools = "0.14.0"

[features]
# fills in probe.rs, off in production
trace=[]
default=[]
