name = "snowy-base-1817"       
main = "worker.js"
compatibility_date = "2026-06-28"

[observability.logs]
enabled = true
invocation_logs = true

# caches GET responses by their Cache-Control
[cache]
enabled = true

# analytics uploads and fetch rate limits; create with `wrangler d1 create hf-analytics`, then apply schema.sql
[[d1_databases]]
binding = "DB"
database_name = "hf-analytics"
database_id = "1fcbabd9-8306-413a-91d4-696f026251aa"

# runs the due lostark.bible follow-ups (worker.js, followUp)
[triggers]
crons = ["0 * * * *"]
