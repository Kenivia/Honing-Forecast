name = "snowy-base-1817"       
main = "worker.js"
compatibility_date = "2026-06-28"
# custom domain, behind the zone's WAF; workers.dev must be kept on explicitly (routes turn it off by default)
routes = [{ pattern = "api.honing-forecast.com", custom_domain = true }]
workers_dev = true

# per-IP limits per route class (worker.js, ROUTE_LIMITS); period 10 or 60 s, counted per Cloudflare location
[[ratelimits]]
name = "LIMIT_BIBLE"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "LIMIT_MARKET"
namespace_id = "1002"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "LIMIT_SNAPSHOTS"
namespace_id = "1003"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "LIMIT_MOVES"
namespace_id = "1004"
simple = { limit = 5, period = 60 }

[observability.logs]
enabled = true
invocation_logs = true

# caches GET responses by their Cache-Control
[cache]
enabled = true

# analytics uploads and fetch rate limits; create with `wrangler d1 create hf-analytics`, then apply schema.sql
[[d1_databases]]
binding = "DB"
database_name = "hf-analytics"
database_id = "1fcbabd9-8306-413a-91d4-696f026251aa"

# runs the due lostark.bible follow-ups (worker.js, followUp)
[triggers]
crons = ["0 * * * *"]
