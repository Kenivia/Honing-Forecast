[target.wasm32-unknown-unknown]
rustflags = ["--cfg", "getrandom_backend=\"wasm_js\"","-C", "target-feature=+simd128" ]

# cooldown: resolve only crates published at least this long ago (Rust 1.100+)
[registry]
global-min-publish-age = "10 days"

[profile.profiling]
inherits = "release"
debug = true

# the repo root, absolute, for paths from it at compile time: env!("HF_ROOT")
[env]
HF_ROOT = { value = "", relative = true }
